# Empty table: this crate is its own workspace root, not part of the parent compiler workspace.
[workspace]

[package]
name = "math"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-pdk = { path = "../../wasm-pdk" }
libm = "0.2"

# opt-level 3: this is a compute package, favour speed over the few KB of size.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
