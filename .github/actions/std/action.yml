name: Std
description: Lint, build and optimize every std wasm package, then stage them on this run's tmp CDN. No release.

runs:
  using: composite
  steps:
    # Stable lints the cdylibs, nightly drives the build-std wasm build.
    - name: Toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy

    - name: Toolchain (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: wasm32-unknown-unknown
        components: rust-src

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          std/json -> target
          std/re -> target
          std/math -> target
          std/struct -> target
        key: std

    # apt ships an old binaryen, so fetch the upstream release.
    - name: Install wasm-opt
      shell: bash
      run: |
        curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz" \
          | tar -xz --strip-components=2 -C /usr/local/bin "binaryen-version_121/bin/wasm-opt"
        wasm-opt --version

    # Lint only the cdylib, --all-targets clashes with its panic handler. The tests run on the host.
    - name: Clippy and test
      shell: bash
      working-directory: std
      run: |
        for p in json re math struct; do
          (cd "$p" && cargo +stable clippy --release --target wasm32-unknown-unknown -- -D warnings && cargo +stable test)
        done

    # `test` is pure Edge Python via entry.py with no crate to build.
    - name: Build
      shell: bash
      working-directory: std
      run: |
        for p in json re math struct; do
          (cd "$p" && RUSTFLAGS="-Z location-detail=none -Z fmt-debug=none -Z unstable-options -C panic=immediate-abort" \
            cargo +nightly build \
              --target wasm32-unknown-unknown \
              --lib --release \
              -Z build-std=std,panic_abort)
        done

    # Keyword-named crates (struct) emit another artifact name.
    - name: Normalize artifact names
      shell: bash
      run: |
        for p in json re math struct; do
          DIR="std/$p/target/wasm32-unknown-unknown/release"
          [ -f "$DIR/$p.wasm" ] || cp "$DIR"/*.wasm "$DIR/$p.wasm"
          ls -lh "$DIR/$p.wasm"
        done

    # Two passes, -Oz then reflatten for a fresh CFG. Traps stay in, they guard bounds.
    - name: Optimize
      shell: bash
      run: |
        for p in json re math struct; do
          WASM="std/$p/target/wasm32-unknown-unknown/release/$p.wasm"
          wasm-opt -Oz --converge \
            --generate-global-effects \
            --strip-debug --strip-producers \
            --enable-bulk-memory-opt \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            -o /tmp/wasm_stage1.wasm "$WASM"

          wasm-opt --flatten --rereloop -Oz -Oz \
            --enable-bulk-memory-opt \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            -o "$WASM" /tmp/wasm_stage1.wasm

          rm /tmp/wasm_stage1.wasm
          ls -lh "$WASM"
        done

    # The corpora run in the test job, against these builds on tmp.
    - name: Stage on tmp
      uses: ./.github/actions/upload
      with:
        part: std
