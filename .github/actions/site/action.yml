name: Site
description: The Astro site on Workers, typechecked and driven through its tests in three engines.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: site/.node-version
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install
      shell: bash
      working-directory: site
      run: npm ci

    # Worker types from the generated wrangler.json, then astro check over pages and the docs.
    - name: Check
      shell: bash
      working-directory: site
      run: npm run check

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-engines

    - name: Install browsers
      shell: bash
      working-directory: site
      run: npx playwright install --with-deps chromium firefox webkit

    # Playwright builds the Worker, serves it on local bindings and drives it, no Cloudflare account involved.
    - name: Test
      shell: bash
      working-directory: site
      run: npm test

    - name: Keep the report when something failed
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-report
        path: site/playwright-report
        retention-days: 7
