name: Site
description: The Astro site on Workers, checked, built, walked through its route corpus and measured in three engines.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: site/.node-version
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install
      shell: bash
      working-directory: site
      run: npm ci

    # Worker types from the generated wrangler.json, then astro check over pages and the docs.
    - name: Check
      shell: bash
      working-directory: site
      run: npm run check

    - name: Build
      shell: bash
      working-directory: site
      run: npm run build

    # The route corpus runs against the built Worker on local bindings, no Cloudflare account involved.
    - name: Test
      shell: bash
      working-directory: site
      run: npm test

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # Three engines this time, cached so only the first run pays the download.
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-engines

    - name: Install browsers
      shell: bash
      run: deno run -A npm:playwright install --with-deps chromium firefox webkit

    # The same screens measured in each engine, geometry compared rather than pixels.
    - name: Browsers
      shell: bash
      working-directory: site
      run: npm run test:browser
