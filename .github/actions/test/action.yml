name: Test
description: The Deno and Chromium suites of the JS host, the std packages and the builtins, against this run's tmp CDN.

inputs:
  suite:
    description: "js | std | builtins"
    required: true
  capability:
    description: "dom | network | storage | time (builtins only)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    # A 150MB Chromium, cached so only the first run pays the download.
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    - name: Install Chromium
      shell: bash
      run: deno run -A npm:playwright install --with-deps chromium

    # The Deno suite proves the host runs with no browser, the Playwright one drives Chromium.
    - name: JS host
      if: inputs.suite == 'js'
      shell: bash
      run: |
        deno test --allow-all js/tests/deno.test.js
        deno test --allow-all js/tests/js.test.js

    - name: Std corpora
      if: inputs.suite == 'std'
      shell: bash
      working-directory: std
      run: deno test --allow-all harness/

    # SYSPKG narrows discovery to one capability, the network fixture is a Deno script the suite spawns.
    - name: Builtin corpora
      if: inputs.suite == 'builtins'
      shell: bash
      working-directory: js/builtins
      env:
        SYSPKG: ${{ inputs.capability }}
      run: deno test --allow-all --node-modules-dir=none tests/
