name: Builtin capability
description: Deno-lint and smoke-test one JS host capability (all JS) in Chromium. No release.

inputs:
  capability:
    description: "dom | network | storage | time"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v5
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('js/builtins/**/deno.json', 'js/builtins/**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Lint src/
      shell: bash
      working-directory: js/builtins/${{ inputs.capability }}
      run: deno lint src/

    # Test against this run's compiler, not the deployed CDN copy.
    - name: Download compiler wasm
      uses: actions/download-artifact@v8
      with:
        name: compiler_wasm
        path: target/wasm32-unknown-unknown/release/

    # A 150MB Chromium, cached so only the first run pays the download.
    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    - name: Install Chromium
      shell: bash
      run: deno run -A npm:playwright install --with-deps chromium

    # SYSPKG narrows discovery to this capability's corpus, the network fixture is a Deno script the suite spawns.
    - name: Test tests/
      shell: bash
      working-directory: js/builtins
      env:
        SYSPKG: ${{ inputs.capability }}
      run: deno test --allow-all --node-modules-dir=none tests/
