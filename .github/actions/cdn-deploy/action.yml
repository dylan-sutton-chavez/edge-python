name: CDN deploy
description: Stage every package output under one tree and deploy it to edge-python-cdn.

inputs:
  cloudflare-api-token:
    description: Cloudflare API token.
    required: true
  cloudflare-account-id:
    description: Cloudflare account id.
    required: true

runs:
  using: composite
  steps:
    - name: Download compiler wasm
      uses: actions/download-artifact@v8
      with:
        name: compiler_wasm
        path: /tmp/compiler/

    - name: Download js/dist
      uses: actions/download-artifact@v8
      with:
        name: js_dist
        path: /tmp/js-dist/

    - name: Download std artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: /tmp/std/
        merge-multiple: true

    - name: Download cli artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: edge-*
        path: /tmp/cli/
        merge-multiple: true

    - name: Install brotli
      shell: bash
      run: command -v brotli >/dev/null || (sudo apt-get update && sudo apt-get install -y brotli)

    - name: Stage site
      shell: bash
      run: |
        mkdir -p _site/js _site/std _site/cli

        # The compiler is served at /compiler.wasm as brotli-11 and _headers tags the encoding.
        brotli -q 11 -c /tmp/compiler/compiler.wasm > _site/compiler.wasm
        printf '/compiler.wasm\n  Content-Type: application/wasm\n  Content-Encoding: br\n  Cache-Control: public, max-age=0, must-revalidate\n' > _site/_headers

        # The JS host lands under /js/ as the public embed URLs, tests/ is not shipped.
        cp -r /tmp/js-dist/. _site/js/src

        # Std packages land as <pkg>.wasm or <pkg>.py.
        cp -r /tmp/std/. _site/std/

        # Each capability src is flattened into _site/js/builtins/<cap>.
        for dir in js/builtins/*/src; do
          cap="$(basename "$(dirname "$dir")")"
          mkdir -p "_site/js/builtins/$cap"
          cp -r "$dir"/. "_site/js/builtins/$cap/"
          # entry.py resolves `_<cap>` via this manifest.
          if [ -f "$dir/entry.py" ]; then
            printf '{ "system": { "_%s": "./index.js" } }\n' "$cap" > "_site/js/builtins/$cap/packages.json"
          fi
        done

        # Release tarballs plus the install and uninstall scripts, served under cdn.edgepython.com/cli/.
        cp -r /tmp/cli/. _site/cli/
        cp cli/setup/install.sh cli/setup/uninstall.sh _site/cli/

    # A notice survives on the run page, a job summary would be buried among the other jobs.
    - name: Report served size
      shell: bash
      run: |
        raw=$(wc -c < /tmp/compiler/compiler.wasm)
        served=$(wc -c < _site/compiler.wasm)
        echo "::notice title=compiler.wasm::served as brotli-11: $(( served / 1024 )) KB (raw $(( raw / 1024 )) KB)"

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy _site --project-name=edge-python-cdn --branch=main
