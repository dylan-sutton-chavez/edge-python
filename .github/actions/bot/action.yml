name: Bot
description: Node and the bot's dependencies, which every job of its workflow starts from.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: bot/.node-version
        cache: npm
        cache-dependency-path: bot/package-lock.json

    - name: Install
      shell: bash
      working-directory: bot
      run: npm ci
