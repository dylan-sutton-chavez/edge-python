name: Docs
description: Nextra static export, built on every run and pushed to edge-python-docs on main.

inputs:
  cloudflare-api-token:
    description: Cloudflare API token (main pushes only).
    required: false
    default: ""
  cloudflare-account-id:
    description: Cloudflare account id (main pushes only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: docs/.tool-versions
        cache: npm
        cache-dependency-path: docs/package-lock.json

    # Reproducible install from the committed lockfile.
    - name: Install
      shell: bash
      working-directory: docs
      run: npm ci

    - name: Build
      shell: bash
      working-directory: docs
      run: npm run build

    # Pull requests and tags only build, the export ships from main pushes.
    - name: Deploy to Cloudflare Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy docs/out --project-name=edge-python-docs --branch=main
