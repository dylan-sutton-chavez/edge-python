name: CLI
description: cli/ is its own workspace. lint is clippy and check, release builds and stages per target, test runs cargo test.

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""
  suite:
    description: "engine | network | actors | skill (test mode)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # cli/build.rs embeds the speed compiler the compiler job staged.
    - name: Fetch the build inputs
      uses: actions/download-artifact@v8
      with:
        name: cdn-compiler
        path: _inputs

    - name: Point the build at them
      shell: bash
      run: echo "EDGE_COMPILER_WASM=$GITHUB_WORKSPACE/_inputs/_build/compiler-cli.wasm" >> "$GITHUB_ENV"

    # mozjs builds SpiderMonkey from source on every target, which needs clang, python and llvm-objdump.
    - name: SpiderMonkey build tools
      shell: bash
      run: |
        case "$RUNNER_OS" in
          # The image carries several LLVMs, and bindgen needs the libclang of the one llvm-config names.
          Linux) sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev python3 && echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV" ;;
          # Xcode's objdump is llvm-objdump under another name.
          macOS) mkdir -p "$RUNNER_TEMP/bin" && ln -sf /usr/bin/objdump "$RUNNER_TEMP/bin/llvm-objdump" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH" ;;
        esac

    # The host is TypeScript and strips in seconds, so it is built here rather than fetched.
    - name: Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    # js/src splits main-thread and worker since tsc rejects mixing the dom and webworker libs.
    - name: Build the JS host
      shell: bash
      working-directory: js
      run: |
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.json
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.worker.json
        # The engine as one classic script, the page hands it to the room as a whole.
        deno bundle --platform browser --format iife src/worker/worker.ts -o dist/worker/bundle.js

    - name: Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.mode == 'test' && 'wasm32-unknown-unknown' || inputs.target }}
        cache: false
        rustflags: ""

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> target
        # lint and every test suite build the same debug SpiderMonkey, so they share one cache.
        shared-key: ${{ inputs.mode != 'release' && 'cli-debug' || '' }}
        key: ${{ inputs.target }}

    # The archive changes only with mozjs_sys, so its lock entry names it, not the whole lock a release bumps.
    - name: SpiderMonkey revision
      id: mozjs
      shell: bash
      run: echo "revision=$(grep -A2 '^name = "mozjs_sys"$' cli/Cargo.lock | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    # After rust-cache, so the archive is saved before rust-cache clears the files loose in target.
    - name: Cache SpiderMonkey
      uses: actions/cache@v6
      with:
        path: |
          cli/target/libmozjs-*.tar.gz
          cli/target/*/libmozjs-*.tar.gz
        key: mozjs-${{ inputs.target || runner.arch }}-${{ steps.mozjs.outputs.revision }}

    # SpiderMonkey compiles once per revision and target, and later jobs link the archive mozjs made of it.
    - name: Link or build SpiderMonkey
      shell: bash
      run: |
        shopt -s nullglob
        archive=(cli/target/libmozjs-*.tar.gz cli/target/*/libmozjs-*.tar.gz)
        if [ ${#archive[@]} -gt 0 ]; then echo "MOZJS_ARCHIVE=$PWD/$archive"; else echo "MOZJS_CREATE_ARCHIVE=1"; fi >> "$GITHUB_ENV"

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      working-directory: cli
      run: |
        cargo clippy --locked --all-targets -- -D warnings
        cargo check

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        case "$TARGET" in
          # musl-gcc has no C++, so the static Linux build runs in Alpine, whose libc is musl.
          *linux-musl)
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/cli" -e EDGE_COMPILER_WASM -e MOZJS_ARCHIVE -e MOZJS_CREATE_ARCHIVE -e OWNER="$(id -u):$(id -g)" \
              rust:alpine sh -c 'sh ../.github/actions/cli/musl.sh && chown -R "$OWNER" target'
            mkdir -p "target/$TARGET/release" && cp target/release/edge "target/$TARGET/release/edge" ;;
          *) cargo build --locked --release --target "$TARGET" ;;
        esac

    - name: Tar
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        tar -C "target/$TARGET/release" -czf "edge-$TARGET.tar.gz" edge

    # The tarball and the install scripts land under cli/.
    - name: Stage
      if: inputs.mode == 'release'
      uses: ./.github/actions/stage
      with:
        part: cli
        name: cdn-cli-${{ inputs.target }}

    # The plugin suite in plugins.json loads this pdk/example build from the root target dir.
    - name: Build the plugin fixture
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == '')
      shell: bash
      run: cargo build --locked --release --target wasm32-unknown-unknown -p slugify-mod

    # The web suite drives a real browser, and the runner image is not a contract, so one is installed.
    - name: Install Chromium
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == '')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

    # engine runs cli and run minus the network corpus, network runs that corpus, actors and skill theirs.
    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      working-directory: cli
      run: |
        case "${{ inputs.suite }}" in
          engine)  cargo test --locked --bin edge --test cli --test run -- --skip builtin_corpora_mirror_the_web_api ;;
          network) cargo test --locked --test run builtin_corpora_mirror_the_web_api ;;
          actors)  cargo test --locked --test actor ;;
          skill)   cargo build --locked && (cd ../skill && SKILL_EDGE="$GITHUB_WORKSPACE/cli/target/debug/edge" cargo test --locked) ;;
          *)       cargo test --locked ;;
        esac
