name: CLI
description: cli/ is its own workspace. lint = clippy + check; release = build per target; test = cargo test.

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Toolchain (lint)
      if: inputs.mode == 'lint'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust (lint)
      if: inputs.mode == 'lint'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      working-directory: cli
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo check

    - name: Toolchain (release)
      if: inputs.mode == 'release'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Install musl tools
      if: inputs.mode == 'release' && contains(inputs.target, 'linux-musl')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    # Gnu releases link through zig against a glibc 2.28 floor so dlopen'd std plugins work everywhere.
    - name: Install cargo-zigbuild
      if: inputs.mode == 'release' && contains(inputs.target, 'linux-gnu')
      shell: bash
      run: command -v cargo-zigbuild >/dev/null || pip3 install --user cargo-zigbuild

    - name: Cache Rust (release)
      if: inputs.mode == 'release'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target
        key: ${{ inputs.target }}

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        case "${{ inputs.target }}" in
          *linux-gnu) cargo zigbuild --release --target "${{ inputs.target }}.2.28" ;;
          *) cargo build --release --target "${{ inputs.target }}" ;;
        esac

    - name: Tar
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      run: tar -C "target/${{ inputs.target }}/release" -czf "edge-${{ inputs.target }}.tar.gz" edge

    - name: Upload release artifact
      if: inputs.mode == 'release'
      uses: actions/upload-artifact@v6
      with:
        name: edge-${{ inputs.target }}
        path: cli/edge-${{ inputs.target }}.tar.gz
        retention-days: 1

    - name: Toolchain (test)
      if: inputs.mode == 'test'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust (test)
      if: inputs.mode == 'test'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target

    # Test against this run's runtime and compiler, not the deployed CDN copies.
    - name: Download compiler wasm
      if: inputs.mode == 'test'
      uses: actions/download-artifact@v8
      with:
        name: compiler_wasm
        path: target/wasm32-unknown-unknown/release/

    # Same idea for the native engine: this run's std plugins and test.py, never the CDN.
    - name: Download native std plugins
      if: inputs.mode == 'test'
      uses: actions/download-artifact@v8
      with:
        pattern: native-*-x86_64-unknown-linux-gnu
        path: std_local/native/
        merge-multiple: true

    - name: Download std test.py
      if: inputs.mode == 'test'
      uses: actions/download-artifact@v8
      with:
        name: dist-test
        path: std_local/std/

    # Drives a real Chromium; ubuntu-latest ships google-chrome-stable.
    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      working-directory: cli
      env:
        EDGE_RUNTIME_DIR: ${{ github.workspace }}/js
        EDGE_COMPILER_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/compiler.wasm
        EDGE_STD_DIR: ${{ github.workspace }}/std_local
      run: cargo test
