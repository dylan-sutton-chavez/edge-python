name: CLI
description: cli/ is its own workspace. lint = clippy + check; release = build per target; test = cargo test.

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""
  suite:
    description: "engine | network | actors | skill (test mode)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # cli/build.rs embeds this run's speed build of compiler.wasm and std packages, never the CDN copies.
    - name: Download compiler wasm
      uses: actions/download-artifact@v8
      with:
        name: compiler_wasm_cli
        path: compiler_cli/

    - name: Download std packages
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: std_local/
        merge-multiple: true

    # Every cargo step below inherits these, the build script reads both paths.
    - name: Point the build script at the artifacts
      shell: bash
      run: |
        echo "EDGE_COMPILER_WASM=$GITHUB_WORKSPACE/compiler_cli/compiler-cli.wasm" >> "$GITHUB_ENV"
        echo "EDGE_STD_DIR=$GITHUB_WORKSPACE/std_local" >> "$GITHUB_ENV"

    - name: Toolchain (lint)
      if: inputs.mode == 'lint'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust (lint)
      if: inputs.mode == 'lint'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      working-directory: cli
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo check

    - name: Toolchain (release)
      if: inputs.mode == 'release'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # musl-gcc compiles the C helpers of the wasmtime deps so the Linux binary links fully static.
    - name: Install musl-tools
      if: inputs.mode == 'release' && contains(inputs.target, 'linux-musl')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Cache Rust (release)
      if: inputs.mode == 'release'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target
        key: ${{ inputs.target }}

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        case "$TARGET" in
          *linux-musl) export "CC_${TARGET//-/_}=musl-gcc" ;;
        esac
        cargo build --release --target "$TARGET"

    - name: Tar
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        bin=edge
        case "$TARGET" in *windows*) bin=edge.exe ;; esac
        tar -C "target/$TARGET/release" -czf "edge-$TARGET.tar.gz" "$bin"

    - name: Upload release artifact
      if: inputs.mode == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: edge-${{ inputs.target }}
        path: cli/edge-${{ inputs.target }}.tar.gz
        retention-days: 1

    - name: Toolchain (test)
      if: inputs.mode == 'test'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust (test)
      if: inputs.mode == 'test'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> cli/target

    # The plugin suite in plugins.json loads this pdk/example build from the root target dir.
    - name: Build the plugin fixture
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == '')
      shell: bash
      run: cargo build --release --target wasm32-unknown-unknown -p slugify-mod

    # engine runs cli and run minus the network corpus, network runs that corpus, actors and skill theirs.
    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      working-directory: cli
      env:
        EDGE_JS_DIR: ${{ github.workspace }}/js
      run: |
        case "${{ inputs.suite }}" in
          engine)  cargo test --test cli --test run -- --skip builtin_corpora_mirror_the_web_api ;;
          network) cargo test --test run builtin_corpora_mirror_the_web_api ;;
          actors)  cargo test --test actor ;;
          skill)   cargo build && (cd ../skill && SKILL_EDGE="$GITHUB_WORKSPACE/cli/target/debug/edge" cargo test) ;;
          *)       cargo test ;;
        esac
