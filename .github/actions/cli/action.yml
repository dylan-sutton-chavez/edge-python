name: CLI
description: cli/ is its own workspace. lint is clippy and check, release builds and stages per target, test runs cargo test.

inputs:
  mode:
    description: "lint | release | test"
    required: true
  target:
    description: Rust target triple (release mode).
    required: false
    default: ""
  suite:
    description: "engine | network | actors | skill (test mode)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # cli/build.rs embeds the speed compiler from tmp, and precompiles the pinned StarlingMonkey.
    - name: Fetch the build inputs
      shell: bash
      run: |
        mkdir -p _inputs
        curl -fsSL --retry 3 "$EDGE_CDN_BASE/_build/compiler-cli.wasm" -o _inputs/compiler-cli.wasm
        curl -fsSL --retry 3 https://github.com/bytecodealliance/StarlingMonkey/releases/download/starlingmonkey-v0.3.0/starling.wasm -o _inputs/starling.wasm
        # macOS ships a BSD sha256sum whose -c takes a digest, shasum reads a checklist everywhere.
        echo "b5707b9d97164e0c29e471844a9ccdd81c445a5d379a9299ae2ee7a9dab3aabe  _inputs/starling.wasm" | shasum -a 256 -c
        echo "EDGE_COMPILER_WASM=$GITHUB_WORKSPACE/_inputs/compiler-cli.wasm" >> "$GITHUB_ENV"
        echo "EDGE_STARLING_WASM=$GITHUB_WORKSPACE/_inputs/starling.wasm" >> "$GITHUB_ENV"

    # The host is TypeScript and strips in seconds, so it is built here rather than fetched.
    - name: Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    # js/src splits main-thread and worker since tsc rejects mixing the dom and webworker libs.
    - name: Build the JS host
      shell: bash
      working-directory: js
      run: |
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.json
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.worker.json

    - name: Toolchain (lint)
      if: inputs.mode == 'lint'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache Rust (lint)
      if: inputs.mode == 'lint'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> target

    - name: Clippy and check
      if: inputs.mode == 'lint'
      shell: bash
      working-directory: cli
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo check

    - name: Toolchain (release)
      if: inputs.mode == 'release'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # musl-gcc compiles the C helpers of the wasmtime deps so the Linux binary links fully static.
    - name: Install musl-tools
      if: inputs.mode == 'release' && contains(inputs.target, 'linux-musl')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Cache Rust (release)
      if: inputs.mode == 'release'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> target
        key: ${{ inputs.target }}

    - name: Build release
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        case "$TARGET" in
          *linux-musl) export "CC_${TARGET//-/_}=musl-gcc" ;;
        esac
        cargo build --release --target "$TARGET"

    - name: Tar
      if: inputs.mode == 'release'
      shell: bash
      working-directory: cli
      env:
        TARGET: ${{ inputs.target }}
      run: |
        tar -C "target/$TARGET/release" -czf "edge-$TARGET.tar.gz" edge

    # The tarball and the install scripts land under cli/, the precompiled runtime under js-runtime/.
    - name: Stage on tmp
      if: inputs.mode == 'release'
      uses: ./.github/actions/upload
      with:
        part: cli

    - name: Toolchain (test)
      if: inputs.mode == 'test'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust (test)
      if: inputs.mode == 'test'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: cli -> target

    # The plugin suite in plugins.json loads this pdk/example build from the root target dir.
    - name: Build the plugin fixture
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == '')
      shell: bash
      run: cargo build --release --target wasm32-unknown-unknown -p slugify-mod

    # The web suite drives a real browser, and the runner image is not a contract, so one is installed.
    - name: Install Chromium
      if: inputs.mode == 'test' && (inputs.suite == 'engine' || inputs.suite == '')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

    # engine runs cli and run minus the network corpus, network runs that corpus, actors and skill theirs.
    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      working-directory: cli
      run: |
        case "${{ inputs.suite }}" in
          engine)  cargo test --bin edge --test cli --test run -- --skip builtin_corpora_mirror_the_web_api ;;
          network) cargo test --test run builtin_corpora_mirror_the_web_api ;;
          actors)  cargo test --test actor ;;
          skill)   cargo build && (cd ../skill && SKILL_EDGE="$GITHUB_WORKSPACE/cli/target/debug/edge" cargo test) ;;
          *)       cargo test ;;
        esac
