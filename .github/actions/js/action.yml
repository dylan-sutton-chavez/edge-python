name: JS
description: The JS host. Deno lint and check, tsc emit to js/dist, then its tree staged.

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Lint
      shell: bash
      run: make lint-js

    # Strips types to js/dist, the shape the CDN and the Playwright suite both serve, pinned tsc version.
    - name: Build
      shell: bash
      run: make js

    # The Deno and Playwright suites run in the test job, against this tree served on loopback.
    - name: Stage
      uses: ./.github/actions/stage
      with:
        part: js
        name: cdn-js
