name: JS
description: Deno/TypeScript runtime. lint = deno lint + deno check; build = tsc emit to web/dist; test = Deno + Playwright suite.

inputs:
  mode:
    description: "lint | build | test"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v5
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Lint
      if: inputs.mode == 'lint'
      shell: bash
      run: deno lint web/

    # web/src is TypeScript, split main-thread (dom lib) / worker (webworker lib) since tsc rejects mixing the two.
    - name: Type check
      if: inputs.mode == 'lint'
      shell: bash
      run: |
        deno check --config web/src/deno.json web/src/index.ts web/src/element.ts
        deno check --config web/src/worker/deno.json web/src/worker/worker.ts web/src/worker/engine.ts

    # Strips types to web/dist, the shape the CDN and the Playwright suite both serve. Pinned tsc version, no package.json in this repo.
    - name: Build
      if: inputs.mode == 'build'
      shell: bash
      working-directory: web
      run: |
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.json
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.worker.json

    - name: Upload web/dist
      if: inputs.mode == 'build'
      uses: actions/upload-artifact@v6
      with:
        name: web_dist
        path: web/dist
        retention-days: 1

    # Test against this run's compiler, not the deployed CDN copy.
    - name: Download compiler wasm
      if: inputs.mode == 'test'
      uses: actions/download-artifact@v8
      with:
        name: compiler_wasm
        path: target/wasm32-unknown-unknown/release/

    # A 150MB Chromium, cached so only the first run pays the download.
    - name: Cache Playwright browsers
      if: inputs.mode == 'test'
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium

    # --with-deps installs the OS libs Chromium needs on Linux.
    - name: Install Chromium
      if: inputs.mode == 'test'
      shell: bash
      run: deno run -A npm:playwright install --with-deps chromium

    - name: Test
      if: inputs.mode == 'test'
      shell: bash
      run: deno test --allow-all web/tests/web.test.js
