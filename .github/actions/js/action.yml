name: JS
description: The JS host. tsc emit to js/dist, then its tree staged on tmp.

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    # Strips types to js/dist, the shape the CDN and the Playwright suite both serve, pinned tsc version.
    - name: Build
      shell: bash
      working-directory: js
      run: |
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.json
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.worker.json
        # The engine as one classic script, the page hands it to the room as a whole.
        deno bundle --platform browser --format iife src/worker/worker.ts -o dist/worker/bundle.js

    - name: Stage on tmp
      uses: ./.github/actions/upload
      with:
        part: js
