name: JS
description: The JS host. Deno lint and check, tsc emit to js/dist, then its tree and the builtins staged on tmp.

runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Deno
      uses: actions/cache@v6
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', '**/deno.lock') }}
        restore-keys: deno-${{ runner.os }}-

    - name: Lint
      shell: bash
      run: deno lint js/

    # js/src splits main-thread (dom lib) and worker (webworker lib) since tsc rejects mixing the two.
    - name: Type check
      shell: bash
      run: |
        deno check --config js/src/deno.json js/src/index.ts js/src/element.ts
        deno check --config js/src/worker/deno.json js/src/worker/worker.ts js/src/worker/engine.ts

    # Strips types to js/dist, the shape the CDN and the Playwright suite both serve, pinned tsc version.
    - name: Build
      shell: bash
      working-directory: js
      run: |
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.json
        deno run -A npm:typescript@5.9.3/tsc -p tsconfig.worker.json

    # The Deno and Playwright suites run in the test job, against this tree on tmp.
    - name: Stage on tmp
      uses: ./.github/actions/upload
      with:
        part: js
