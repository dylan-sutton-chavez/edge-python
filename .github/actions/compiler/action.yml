name: Compiler
description: Rust compiler crate. Shear and clippy, wasm build and optimize, tests, tmp staging, tag release.

inputs:
  github-token:
    description: Token for the tag Release upload (tags only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy

    - name: Install cargo-shear
      shell: bash
      run: cargo install cargo-shear --locked

    # Detects declared but unused dependencies across the workspace.
    - name: Shear
      shell: bash
      run: cargo shear

    - name: Clippy (host)
      shell: bash
      run: cargo clippy --all-targets -- -D warnings

    - name: Clippy (wasm)
      shell: bash
      run: cargo clippy --lib --no-default-features --target wasm32-unknown-unknown -p edge-python -p slugify-mod -- -D warnings

    # build-std needs nightly plus rust-src.
    - name: Toolchain (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: wasm32-unknown-unknown
        components: rust-src

    # apt ships an old binaryen, so fetch the upstream release.
    - name: Install wasm-opt
      shell: bash
      run: |
        curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz \
          | tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_121/bin/wasm-opt
        wasm-opt --version

    - name: Build
      shell: bash
      run: |
        RUSTFLAGS="-Z location-detail=none -Z fmt-debug=none -Z unstable-options -C panic=immediate-abort" \
        cargo +nightly build \
          --target wasm32-unknown-unknown \
          --lib \
          --release \
          -p edge-python \
          --no-default-features \
          -Z build-std=std,panic_abort \
          -Z build-std-features=optimize_for_size

    - name: Size (unoptimized)
      shell: bash
      run: ls -lh target/wasm32-unknown-unknown/release/compiler.wasm

    # Three passes, -Oz, reflatten for a fresh CFG, then a converge sweep. Traps stay, they guard bounds.
    - name: Optimize
      shell: bash
      run: |
        INPUT=target/wasm32-unknown-unknown/release/compiler.wasm

        wasm-opt -Oz --converge \
          --generate-global-effects \
          --strip-debug --strip-producers \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o /tmp/wasm_stage1.wasm "$INPUT"

        wasm-opt --flatten --rereloop -Oz -Oz \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o /tmp/wasm_stage2.wasm /tmp/wasm_stage1.wasm

        wasm-opt -Oz --converge \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o "$INPUT" /tmp/wasm_stage2.wasm

        rm /tmp/wasm_stage1.wasm /tmp/wasm_stage2.wasm

    - name: Size (optimized)
      shell: bash
      run: ls -lh target/wasm32-unknown-unknown/release/compiler.wasm

    # The CLI precompiles its compiler.wasm to native code, so this build trades size for speed.
    - name: Build (CLI)
      shell: bash
      run: |
        cargo build --profile cli --target wasm32-unknown-unknown -p edge-python --no-default-features
        CLI_WASM=target/wasm32-unknown-unknown/cli/compiler.wasm
        wasm-opt -O3 --enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types -o /tmp/compiler-cli.wasm "$CLI_WASM"
        mv /tmp/compiler-cli.wasm "$CLI_WASM"
        ls -lh "$CLI_WASM"

    - name: Test
      shell: bash
      run: cargo test -p edge-python -p lang

    # compiler.wasm ships, the speed build goes under _build/ for the CLI jobs.
    - name: Stage on tmp
      uses: ./.github/actions/upload
      with:
        part: compiler

    - name: Upload WASM Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.github-token }}
        files: target/wasm32-unknown-unknown/release/compiler.wasm
        fail_on_unmatched_files: true
        generate_release_notes: true
