name: Compiler
description: Rust compiler crate. Shear and clippy, wasm build and optimize, tests, staging, tag release.

inputs:
  github-token:
    description: Token for the tag Release upload (tags only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    # The release, its wasm target and clippy all come from rust-toolchain.toml, so a bump edits that file alone.
    - name: Toolchain (pinned)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        cache: false
        rustflags: ""

    # rust-cache drops binaries installed during the job, so take the prebuilt one.
    - name: Install cargo-shear
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-shear@1.13.4

    # Detects declared but unused dependencies across the workspace.
    - name: Shear
      shell: bash
      run: cargo shear

    - name: Clippy (host)
      shell: bash
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Clippy (wasm)
      shell: bash
      run: |
        cargo clippy --locked --lib --no-default-features --features edge-python/runtime --target wasm32-unknown-unknown -p edge-python -p slugify-mod -- -D warnings
        cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -p edge-python -- -D warnings

    # build-std needs nightly plus rust-src.
    - name: Toolchain (nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: wasm32-unknown-unknown
        components: rust-src

    # apt ships an old binaryen, so fetch the upstream release.
    - name: Install wasm-opt
      shell: bash
      run: |
        curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_121/binaryen-version_121-x86_64-linux.tar.gz \
          | tar -xz --strip-components=2 -C /usr/local/bin binaryen-version_121/bin/wasm-opt
        wasm-opt --version

    - name: Build
      shell: bash
      run: |
        RUSTFLAGS="-Z location-detail=none -Z fmt-debug=none -Z unstable-options -C panic=immediate-abort" \
        cargo +nightly rustc \
          --target wasm32-unknown-unknown \
          --lib \
          --release \
          -p edge-python \
          --no-default-features \
          --features runtime \
          --crate-type cdylib \
          -Z build-std=std,panic_abort \
          -Z build-std-features=optimize_for_size

    - name: Size (unoptimized)
      shell: bash
      run: ls -lh target/wasm32-unknown-unknown/release/compiler.wasm

    # Three passes, -Oz, reflatten for a fresh CFG, then a converge sweep. Traps stay, they guard bounds.
    - name: Optimize
      shell: bash
      run: |
        INPUT=target/wasm32-unknown-unknown/release/compiler.wasm

        wasm-opt -Oz --converge \
          --generate-global-effects \
          --strip-debug --strip-producers \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o /tmp/wasm_stage1.wasm "$INPUT"

        wasm-opt --flatten --rereloop -Oz -Oz \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o /tmp/wasm_stage2.wasm /tmp/wasm_stage1.wasm

        wasm-opt -Oz --converge \
          --enable-bulk-memory-opt \
          --enable-nontrapping-float-to-int \
          --enable-sign-ext \
          -o "$INPUT" /tmp/wasm_stage2.wasm

        rm /tmp/wasm_stage1.wasm /tmp/wasm_stage2.wasm

    # A notice survives on the run page, a job summary would be buried among the other jobs.
    - name: Size
      shell: bash
      run: |
        wasm=target/wasm32-unknown-unknown/release/compiler.wasm
        echo "::notice title=compiler.wasm::served as brotli-11: $(( $(brotli -q 11 -c "$wasm" | wc -c) / 1024 )) KB (raw $(( $(wc -c < "$wasm") / 1024 )) KB)"

    # The CLI precompiles its compiler.wasm to native code, so this build trades size for speed.
    - name: Build (CLI)
      shell: bash
      run: |
        cargo rustc --locked --profile cli --target wasm32-unknown-unknown -p edge-python --lib --no-default-features --features runtime --crate-type cdylib
        CLI_WASM=target/wasm32-unknown-unknown/cli/compiler.wasm
        wasm-opt -O3 --enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types -o /tmp/compiler-cli.wasm "$CLI_WASM"
        mv /tmp/compiler-cli.wasm "$CLI_WASM"
        ls -lh "$CLI_WASM"

    - name: Test
      shell: bash
      run: cargo test --locked -p edge-python

    # On its own, since the coverage build leaves method calls unfused and the corpus above must run fused.
    - name: Coverage hook
      shell: bash
      run: cargo test --locked -p edge-python --features coverage coverage

    # On its own too, it recounts every slot at each collection to prove the running count.
    - name: Memory count
      shell: bash
      run: cargo test --locked --release -p edge-python --features memcheck --test tests vm::test::test_cases

    # compiler.wasm ships, the speed build goes under _build/ for the CLI jobs.
    - name: Stage
      uses: ./.github/actions/stage
      with:
        part: compiler
        name: cdn-compiler

    - name: Upload WASM Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.github-token }}
        files: target/wasm32-unknown-unknown/release/compiler.wasm
        fail_on_unmatched_files: true
        generate_release_notes: true
