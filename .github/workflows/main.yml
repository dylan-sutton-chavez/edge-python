name: CI / CD

# Single pipeline for the monorepo, each job's logic lives in a composite action, this wires the graph.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-check:
    name: Compiler / Lint and Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compiler
        with:
          mode: check

  js-lint:
    name: JS / Deno Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/js
        with:
          mode: lint

  compiler:
    name: Compiler / Test and Release
    needs: [compiler-check, js-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/compiler
        with:
          mode: build
          github-token: ${{ github.token }}

  js:
    name: JS / Deno Test
    needs: [compiler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/js
        with:
          mode: test

  # Strips js/src to plain JS, the CDN can't serve TypeScript. Independent of the compiler build.
  js-build:
    name: JS / Build
    needs: [js-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/js
        with:
          mode: build

  builtins:
    name: Builtins / ${{ matrix.capability }}
    needs: [js]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capability: [dom, network, storage, time]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/builtins
        with:
          capability: ${{ matrix.capability }}

  std:
    name: Std / ${{ matrix.package }}
    needs: [js]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [json, re, math, struct, test]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/std
        with:
          package: ${{ matrix.package }}

  # cli/build.rs embeds this run's compiler.wasm and std packages, so every cli job waits for both.
  cli-lint:
    name: CLI / Lint and Check
    needs: [compiler, std]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cli
        with:
          mode: lint

  # Plain cargo per target, musl keeps the Linux binary static, starts as soon as cli-lint is green.
  cli-release:
    name: CLI / Release (${{ matrix.target }})
    needs: [cli-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            experimental: true
    runs-on: ${{ matrix.runner }}
    # A red Windows build is reported without blocking the Unix releases behind it.
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cli
        with:
          mode: release
          target: ${{ matrix.target }}

  cli-test:
    name: CLI / Test / ${{ matrix.suite }}
    needs: [builtins, std, cli-release, js-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, network, actors, skill]
    steps:
      - uses: actions/checkout@v6
      - name: Download js/dist (JS build output)
        uses: actions/download-artifact@v8
        with:
          name: js_dist
          path: js/dist
      - uses: ./.github/actions/cli
        with:
          mode: test
          suite: ${{ matrix.suite }}

  cdn:
    name: Cloudflare Upload (CDN)
    needs: [cli-test, js-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cdn-deploy
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Builds on every run (PR gate) and uploads the static export for docs-deploy.
  docs-build:
    name: Docs / Build
    needs: [cli-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/docs
        with:
          mode: build

  # Tail of the docs build and deploy chain, main pushes only.
  docs-deploy:
    name: Docs / Deploy
    needs: [docs-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/docs
        with:
          mode: deploy
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
