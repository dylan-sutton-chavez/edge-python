name: CI / CD

# One node per composite action, and needs edges carry artifacts or gate a deploy.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compiler
        with:
          github-token: ${{ github.token }}

  # One job builds every std, so cross-package corpora import the sibling builds.
  std:
    name: Std
    needs: [compiler]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/std

  js:
    name: JS
    needs: [compiler, std]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/js

  builtins:
    name: Builtins / ${{ matrix.capability }}
    needs: [compiler]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        capability: [actor, dom, network, storage, time]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/builtins
        with:
          capability: ${{ matrix.capability }}

  # cli/build.rs embeds this run's compiler and std builds, and the test suites vendor js_dist.
  cli:
    name: CLI / ${{ matrix.entry }}
    needs: [compiler, js, std]
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: lint
            mode: lint
            runner: ubuntu-26.04
          - entry: test engine
            mode: test
            suite: engine
            runner: ubuntu-26.04
          - entry: test network
            mode: test
            suite: network
            runner: ubuntu-26.04
          - entry: test actors
            mode: test
            suite: actors
            runner: ubuntu-26.04
          - entry: test skill
            mode: test
            suite: skill
            runner: ubuntu-26.04
          - entry: x86_64-unknown-linux-musl
            mode: release
            target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - entry: aarch64-unknown-linux-musl
            mode: release
            target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - entry: aarch64-apple-darwin
            mode: release
            target: aarch64-apple-darwin
            runner: macos-15
          - entry: x86_64-apple-darwin
            mode: release
            target: x86_64-apple-darwin
            runner: macos-15
          - entry: x86_64-pc-windows-msvc
            mode: release
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            experimental: true
    runs-on: ${{ matrix.runner }}
    # A red Windows build is reported without blocking the Unix releases behind it.
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7
      - name: Download js/dist (JS build output)
        if: matrix.mode == 'test'
        uses: actions/download-artifact@v8
        with:
          name: js_dist
          path: js/dist
      - uses: ./.github/actions/cli
        with:
          mode: ${{ matrix.mode }}
          suite: ${{ matrix.suite }}
          target: ${{ matrix.target }}

  cdn:
    name: CDN
    needs: [js, std, builtins, cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cdn-deploy
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Builds on every run as a gate, deploys on main once the CDN serves every URL.
  docs:
    name: Docs
    needs: [cdn]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docs
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
