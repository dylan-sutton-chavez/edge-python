name: CI / CD

# Builds stage into this run's tmp CDN prefix, tests read it back, promote ships it to dev.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  EDGE_RUN: ${{ github.run_id }}
  EDGE_CDN_BASE: https://cdn.tmp.edgepython.com/${{ github.run_id }}

jobs:
  compiler:
    name: Compiler
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compiler
        with:
          github-token: ${{ github.token }}

  std:
    name: Std
    needs: [compiler]
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/std

  js:
    name: JS
    needs: [compiler]
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/js

  # cli/build.rs embeds the compiler and std builds this run staged on tmp.
  cli:
    name: CLI / ${{ matrix.entry }}
    needs: [std, js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: lint
            mode: lint
            runner: ubuntu-26.04
          - entry: x86_64-unknown-linux-musl
            mode: release
            target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - entry: aarch64-unknown-linux-musl
            mode: release
            target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - entry: aarch64-apple-darwin
            mode: release
            target: aarch64-apple-darwin
            runner: macos-15
          - entry: x86_64-apple-darwin
            mode: release
            target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/cli
        with:
          mode: ${{ matrix.mode }}
          target: ${{ matrix.target }}

  # Every suite runs against the tmp CDN this run staged, never the deployed one.
  test:
    name: Test / ${{ matrix.entry }}
    needs: [cli]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: js
            suite: js
          - entry: std
            suite: std
          - entry: builtins-dom
            suite: builtins
            capability: dom
          - entry: builtins-network
            suite: builtins
            capability: network
          - entry: builtins-storage
            suite: builtins
            capability: storage
          - entry: builtins-time
            suite: builtins
            capability: time
          - entry: cli-engine
            cli: engine
          - entry: cli-network
            cli: network
          - entry: cli-actors
            cli: actors
          - entry: cli-skill
            cli: skill
    steps:
      - uses: actions/checkout@v7
      - if: matrix.suite
        uses: ./.github/actions/test
        with:
          suite: ${{ matrix.suite }}
          capability: ${{ matrix.capability }}
      - if: matrix.cli
        uses: ./.github/actions/cli
        with:
          mode: test
          suite: ${{ matrix.cli }}

  site:
    name: Site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/site

  # Main pushes only, the tested tmp tree and the site ship together to dev.
  promote:
    name: Promote
    needs: [test, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_EMAILS: ${{ secrets.DEV_CLOUDFLARE_ACCESS_EMAILS }}
      OAUTH_GITHUB_ID: ${{ secrets.DEV_OAUTH_GITHUB_ID }}
      OAUTH_GITHUB_SECRET: ${{ secrets.DEV_OAUTH_GITHUB_SECRET }}
      OAUTH_GOOGLE_ID: ${{ secrets.DEV_OAUTH_GOOGLE_ID }}
      OAUTH_GOOGLE_SECRET: ${{ secrets.DEV_OAUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/promote
