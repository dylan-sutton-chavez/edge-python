name: Move secrets

# Run once by hand, then deleted with the MIGRATE_TOKEN it reads.
on:
  workflow_dispatch:

permissions: {}

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Copy every secret into edge-python-source
        env:
          GH_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_CLOUDFLARE_ACCESS_EMAILS: ${{ secrets.DEV_CLOUDFLARE_ACCESS_EMAILS }}
          DEV_OAUTH_GITHUB_ID: ${{ secrets.DEV_OAUTH_GITHUB_ID }}
          DEV_OAUTH_GITHUB_SECRET: ${{ secrets.DEV_OAUTH_GITHUB_SECRET }}
          DEV_OAUTH_GOOGLE_ID: ${{ secrets.DEV_OAUTH_GOOGLE_ID }}
          DEV_OAUTH_GOOGLE_SECRET: ${{ secrets.DEV_OAUTH_GOOGLE_SECRET }}
          PROD_OAUTH_GITHUB_ID: ${{ secrets.PROD_OAUTH_GITHUB_ID }}
          PROD_OAUTH_GITHUB_SECRET: ${{ secrets.PROD_OAUTH_GITHUB_SECRET }}
          PROD_OAUTH_GOOGLE_ID: ${{ secrets.PROD_OAUTH_GOOGLE_ID }}
          PROD_OAUTH_GOOGLE_SECRET: ${{ secrets.PROD_OAUTH_GOOGLE_SECRET }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        # Each value goes through stdin, so none of them is ever written to the log.
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEV_CLOUDFLARE_ACCESS_EMAILS \
            DEV_OAUTH_GITHUB_ID DEV_OAUTH_GITHUB_SECRET DEV_OAUTH_GOOGLE_ID DEV_OAUTH_GOOGLE_SECRET \
            PROD_OAUTH_GITHUB_ID PROD_OAUTH_GITHUB_SECRET PROD_OAUTH_GOOGLE_ID PROD_OAUTH_GOOGLE_SECRET DISCORD_TOKEN; do
            printenv "$name" | gh secret set "$name" --repo dylan-sutton-chavez/edge-python-source
            echo "moved $name"
          done
