[package]
name = "wasm-pdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Edge Python Plugin Development Kit, author-side runtime for writing plugin modules importable from Edge Python scripts, compiled to `.wasm` for the web runtime or to native `.so`/`.dylib` for the CLI's in-process engine. Provides `#[plugin_fn]` proc-macro, Handle/Value/Error types, and From/IntoValue traits over the v1 wasm-abi."

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
wasm-abi = { workspace = true }
wasm-pdk-macros = { path = "macros" }

# Re-exported only so `wasm_pdk::module!()` / `module_fixed_pool!()` can refer to the symbol paths. Plugin authors who skip the macros and declare their own #[global_allocator] do not pay for this, Rust drops unused crates from the cdylib.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = "0.4"
linked_list_allocator = { version = "0.10", default-features = false }
