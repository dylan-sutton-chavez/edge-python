[package]
name = "lang"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding API over the Edge Python engine for building your own scripting language."

[lib]
name = "lang"
crate-type = ["rlib"]
test = false
doctest = false

[[test]]
name = "tests"
path = "tests.rs"

[features]
default = ["std"]
std = ["compiler/std"]

[dependencies]
compiler = { package = "edge-python", path = "..", default-features = false }
