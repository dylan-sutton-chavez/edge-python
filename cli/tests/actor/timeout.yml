# An untrusted run that never yields is cut by the epoch deadline, the reply names the limit.
runtime:
  listen: tcp://127.0.0.1:7790
  control: tcp://127.0.0.1:9790
  durable: tmp/actor/log

groups:
  runners:
    eval: true

expect: []

# Each pass is one builtin call, so the op budget stays far off while the clock runs.
post:
  - path: "/eval/runners"
    body: "while True:\n    n = sum(range(1000000))"
    expect: "time limit"
