# An eval group compiles each published message as its own program, print output proves execution.
runtime:
  listen: tcp://127.0.0.1:7789
  control: tcp://127.0.0.1:9789
  durable: tmp/actor/log

groups:
  runners:
    replicas: 4
    eval: true

publish:
  - "runners print('two plus three is', 2 + 3)"
  - "runners print('hello from a snippet')"
  # Building a list and a string exercises the allocator inside the sandboxed instance.
  - "runners print(''.join(str(i) for i in range(5)))"

expect:
  - "two plus three is 5"
  - "hello from a snippet"
  - "01234"

# A POST to /eval/<group> runs the body on the eval group and replies with what it printed.
post:
  - path: "/eval/runners"
    body: "print('answered over http')"
    expect: "{\"ok\":true,\"stdout\":\"answered over http\\n\"}"
  # A snippet has no scheduler to send through, send() names what it lacks.
  - path: "/eval/runners"
    body: "send('g', 'x')"
    expect: "send() needs an actor scheduler, missing in this runtime"
  # A declared module that grants no I/O works in a snippet.
  - path: "/eval/runners"
    body: "import time\nprint(callable(time.time))"
    expect: "{\"ok\":true,\"stdout\":\"True\\n\"}"
  # A snippet that sleeps runs to its end within the deadline, both prints come back.
  - path: "/eval/runners"
    body: "from time import sleep\nprint('a')\nawait sleep(0.2)\nprint('b')"
    expect: "{\"ok\":true,\"stdout\":\"a\\nb\\n\"}"
  # A snippet's JavaScript runtime is offline, so a fetch fails before it leaves the host.
  - path: "/eval/runners"
    body: "from network import fetch_text\nprint(fetch_text('http://127.0.0.1:9789/stats'))"
    expect: "\"ok\":false,\"error\":\"error: RuntimeError: NetworkError when attempting to fetch resource"
