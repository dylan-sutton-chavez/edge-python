# An empty table makes this crate its own workspace root, apart from the compiler workspace.
[workspace]

[package]
name = "edge"
version = "0.5.0"
edition = "2024"
description = "The Edge Python developer CLI. Runs, tests, and scaffolds scripts on the same compiler.wasm the browser uses, hosted under wasmtime, packs apps into standalone binaries or bundles, and runs cooperative actor pools."

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
# The engine crate as a library, manifest parsing and sha256 pinning.
edge-python = { path = ".." }
# Runs the precompiled compiler.wasm, Cranelift compiles the third party plugins a project declares.
wasmtime = { version = "48", default-features = false, features = ["runtime", "std", "cranelift", "component-model"] }
# WASI and outgoing HTTP for the StarlingMonkey component that runs JavaScript modules.
wasmtime-wasi = "48"
wasmtime-wasi-http = "48"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["sync", "io-util"] }
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses the actor.yml manifest, the maintained fork of serde_yaml.
serde_yaml_ng = "0.10"
anyhow = "1"
# Line editor + history for `edge repl`.
rustyline = "17.0.0"
# HTTPS for URL imports, `edge build` vendoring and the JavaScript runtime download.
ureq = { version = "3", features = ["brotli"] }
# Stable actor keys that survive removal, so the scheduler queues never dangle.
slab = "0.4"
# A unique temp file for the uninstall script, a predictable path invites symlink squatting.
tempfile = "3"

[build-dependencies]
# Precompiles compiler.wasm, the std packages and the JavaScript runtime for the build target.
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "all-arch", "std", "component-model"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# build.rs runs Cranelift over compiler.wasm, unoptimized it takes ten times longer.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
