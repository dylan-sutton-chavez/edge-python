# Empty table: this crate is its own workspace root, not part of the parent compiler workspace.
[workspace]

[package]
name = "edge"
version = "0.1.0"
edition = "2024"
description = "The Edge Python developer CLI. Runs, tests, and scaffolds scripts on the in-process native engine by default, drives the browser runtime behind --web, and serves and bundles web apps."

[[bin]]
name = "edge"
path = "src/main.rs"

[dependencies]
# The engine crate, devkit helpers plus the in-process native engine.
edge-python = { path = "..", default-features = false, features = ["native"] }
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Catches Ctrl+C in non-REPL commands so they shut down cleanly.
ctrlc = "3"
# Drives a system-installed Chrome/Chromium via CDP; the install.sh provisions the browser.
headless_chrome = "1.0.21"
# Line editor + history for `edge repl`.
rustyline = "17.0.0"
# HTTPS fetcher used by `edge build` to vendor the runtime, compiler.wasm, and packages.
ureq = "3"

# Static musl builds keep musl's slow malloc otherwise.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
# Per-test tempdir; auto-cleans on drop so cases don't leak state into the project.
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
